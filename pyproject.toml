[tool.poetry]
name = "page-refresher"
version = "0.1.0"
description = "Page Refresher"
authors = ["hasansezertasan <hasansezertasan@gmail.com>"]
readme = "README.md"
maintainers = ["hasansezertasan <hasansezertasan@gmail.com>"]
classifiers = ["Private :: Do not Upload"]
packages = [{ include = "page_refresher" }]

[tool.poetry.scripts]
page-refresher = { reference = "page_refresher.main:app", type = "console" }
page-refresher-tkinter = { reference = "page_refresher.tkinter:main", type = "console" }


[tool.poetry.dependencies]
python = ">=3.8,<3.12"
selenium = "^4.0.0"
webdriver-manager = "^4.0.0"
typer = { extras = ["all"], version = "^0.9.0" }
customtkinter = { version = "^5.0.0", optional = true }
playwright = { version = "^1.0.0", optional = true }
undetected-chromedriver = { version = "^3.0.0", optional = true }

[tool.poetry.extras]
customtkinter = ["customtkinter"]
playwright = ["playwright"]
undetected-chromedriver = ["undetected-chromedriver"]
all = [
  "customtkinter",
  "playwright",
  "undetected-chromedriver",
]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.28.0"
isort = "^5.13.2"
black = { extras = ["jupyter"], version = "^23.12.1" }
mypy = "^1.8.0"
ruff = "^0.1.13"
pre-commit = "^3.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"

[tool.ruff]
# Run `ruff linter` command to see all available linters and their descriptions
target-version = "py311"
line-length = 120
select = [
  # "B",
  # "C",
  "E",
  "F",
  "W",
  "I",
  "B9",
]
ignore = [
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  "E501", # line too long, handled by black
  "F401", # imported but unused
  "E402", # module level import not at top of file
  "E712", # comparison to True should be 'if cond is True:' or 'if cond:'
]
exclude = ["alembic", "migrations"]
show-fixes = true

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
skip_glob = ["**/alembic/**", "**/migrations/**"]


[tool.black]
line-length = 120
target-version = ['py311']
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic
  )/
)
'''


[tool.poe.tasks]
black = "black ."
isort = "isort ."
ruff = "ruff ."
bir = ["black", "isort", "ruff"]
