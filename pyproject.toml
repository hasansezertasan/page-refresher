[project]
name = "page-refresher"
version = "0.1.0"
description = "Page Refresher"
readme = "README.md"
authors = [{ name = "hasansezertasan", email = "hasansezertasan@gmail.com" }]
maintainers = [
  { name = "hasansezertasan", email = "hasansezertasan@gmail.com" },
]
classifiers = []
requires-python = ">=3.15"
dependencies = ["selenium==4.51.0", "webdriver-manager==4.1.2", "typer==0.27.3"]


[project.optional-dependencies]
tkinter = ["customtkinter==6.0.0"]
flet = ["flet==1.0.4"]
nicegui = ["nicegui[native]==3.14.0"]
playwright = ["playwright==1.63.0"]
all = [
  "page-refresher[tkinter,flet,nicegui]"
]


[project.scripts]
page-refresher = "page_refresher.main:app"


[dependency-groups]
dev = ["page-refresher[all]", "pytest>=9.1.1", "ruff>=0.15.10"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/page_refresher"]


[tool.ruff]
fix = true
output-format = "full"
preview = true
show-fixes = true
src = ["src"]
target-version = "py315"
unsafe-fixes = true


[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
skip-magic-trailing-comma = true


[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["COM812", "CPY", "FIX", "TD"]
preview = true
select = ["ALL"]


[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.mccabe]
max-complexity = 5


[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true


[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.per-file-ignores]
"./scripts/*.py" = ["INP001", "S404", "S603", "T201"]
"./tests/*.py" = ["D103", "INP001", "PLR2004", "S101", "S404", "S603"]


[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.ruff.lint.ruff]
parenthesize-tuple-in-subscript = true
